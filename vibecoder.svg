<svg width="256" height="256" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="cyan_gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="purple_gradient" x1="100" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg_gradient)"/>

  <!-- Left Brain - Creative (Cyan) -->
  <path d="M48 25 C30 25, 15 35, 15 55 C15 75, 30 85, 40 85 C45 85, 48 80, 48 75" stroke="url(#cyan_gradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M25 40 C20 45, 20 60, 25 65" stroke="url(#cyan_gradient)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M35 32 C28 35, 28 45, 35 48" stroke="url(#cyan_gradient)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Right Brain - Logic/Circuit (Purple) -->
  <path d="M52 25 C70 25, 85 35, 85 55 C85 75, 70 85, 60 85 C55 85, 52 80, 52 75" stroke="url(#purple_gradient)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Circuit Nodes -->
  <circle cx="75" cy="40" r="2" fill="#d8b4fe"/>
  <circle cx="80" cy="55" r="2" fill="#d8b4fe"/>
  <circle cx="65" cy="75" r="2" fill="#d8b4fe"/>

  <!-- Circuit Lines -->
  <path d="M52 35 L65 35 L75 40" stroke="url(#purple_gradient)" stroke-width="2" opacity="0.7"/>
  <path d="M85 55 L75 55 L70 65" stroke="url(#purple_gradient)" stroke-width="2" opacity="0.7"/>

  <!-- Central Divider -->
  <line x1="50" y1="20" x2="50" y2="90" stroke="white" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Text VC -->
  <text x="50" y="60" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="sans-serif">VC</text>
</svg>
